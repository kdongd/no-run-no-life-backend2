spring:
  application:
    name: norunnolifeexample
  datasource:
    url: jdbc:mysql://localhost:3306/norunnolife
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500
