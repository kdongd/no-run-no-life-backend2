spring:
  application:
    name: norunnolifeexample
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500