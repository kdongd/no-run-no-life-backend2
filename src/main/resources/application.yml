spring:
  application:
    name: norunnolifeexample
  datasource:
    url: jdbc:mysql://localhost:3306/norunnolife
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32bytes+}
  access-token-expiration-ms: 3600000

google:
  client-id: ${GOOGLE_CLIENT_ID:local-dev-placeholder-client-id}

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:5174
