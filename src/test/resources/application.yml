spring:
  application:
    name: norunnolifeexample
  datasource:
    url: jdbc:mysql://localhost:3306/norunnolife
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: false
  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: test-only-dummy-jwt-secret-never-use-in-production-32bytes-minimum-1234567890
  access-token-expiration-ms: 3600000

google:
  client-id: local-dev-placeholder-client-id

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:5174
